# Override for environments where container-to-container bridge traffic is blocked (this Codespace).
# Use:  docker compose -f docker-compose.yml -f docker-compose.hostnet.yml up --build -d
services:
  ml:
    network_mode: host
    environment: { ML_HOST: 127.0.0.1 }
  backend:
    network_mode: host
    environment: { ML_URL: "http://127.0.0.1:5001" }
  frontend:
    network_mode: host
    ports: !reset []
    volumes: ["./frontend/nginx.hostnet.conf:/etc/nginx/conf.d/default.conf:ro"]
